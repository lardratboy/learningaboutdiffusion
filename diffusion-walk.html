<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside a Diffusion Model — 3D Data-Flow Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--panel:#10131c;--panel2:#161a26;--line:#252b3b;--text:#d9deea;--dim:#8a93a8;--accent:#ffb35a;--accent2:#5ac8ff;--good:#7ee0a1;--toy:#c49bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:410px 1fr;height:100vh}
#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#brand{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
#brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
#brand p{margin:2px 0 0;color:var(--dim);font-size:12px}
#chips{display:flex;flex-wrap:wrap;gap:4px;padding:10px 18px;border-bottom:1px solid var(--line)}
#chips button{width:28px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font:600 11px 'JetBrains Mono',monospace;cursor:pointer}
#chips button:hover{color:#fff;border-color:#3a4258}
#chips button.on{background:var(--accent);color:#1a1206;border-color:var(--accent)}
#content{flex:1;overflow:auto;padding:16px 18px 8px}
#content h2{font-size:20px;margin:2px 0 8px;line-height:1.25}
#content p{margin:8px 0}
.kicker{color:var(--accent);font:600 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px}
.eq{font-family:'JetBrains Mono',monospace;background:#0c0f17;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:12px;overflow-x:auto;white-space:pre;line-height:1.6}
.box{padding:8px 11px;border-radius:0 8px 8px 0;margin:10px 0;font-size:12.5px;line-height:1.5}
.real{border-left:3px solid var(--accent2);background:#0e1724}
.toy{border-left:3px solid var(--toy);background:#16112a}
.try{border-left:3px solid var(--good);background:#0d1a14}
.box b.h{display:block;font:600 10.5px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
.real b.h{color:var(--accent2)}.toy b.h{color:var(--toy)}.try b.h{color:var(--good)}
.tn{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--accent);cursor:pointer;border-bottom:1px dotted rgba(255,179,90,.5);white-space:nowrap}
.tn:hover{color:#fff}
button.act{background:#1d2333;border:1px solid #333b52;color:#fff;border-radius:6px;padding:2px 8px;font:500 12px Inter;cursor:pointer}
button.act:hover{border-color:var(--accent)}
#ctrls{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
#ctrls:empty{display:none}
.row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.row .lab{width:110px;color:var(--dim);flex:none}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row .val{width:96px;text-align:right;font:12px 'JetBrains Mono',monospace;color:#fff;flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:#232a3c;border:1px solid #343c54;color:#fff;border-radius:8px;padding:6px 11px;font:500 12.5px Inter;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:600}
.wchip{background:#1a2030;border:1px solid #303850;color:var(--text);border-radius:14px;padding:3px 9px;font:12px 'JetBrains Mono',monospace;cursor:pointer}
.wchip.on{background:var(--accent2);color:#04121d;border-color:var(--accent2)}
.bars{display:grid;grid-template-columns:86px 1fr 46px;gap:3px 8px;font:11.5px 'JetBrains Mono',monospace;align-items:center}
.bars .b{height:9px;background:linear-gradient(90deg,#ffb35a,#ffe08a);border-radius:3px;min-width:1px}
.bars .n{color:var(--dim);text-align:right}
.readout{font:12px 'JetBrains Mono',monospace;color:var(--dim)}
.readout b{color:#fff;font-weight:600}
table.shapes{width:100%;border-collapse:collapse;font:11.5px 'JetBrains Mono',monospace;margin:8px 0}
table.shapes td,table.shapes th{border-bottom:1px solid var(--line);padding:4px 4px;text-align:left}
table.shapes th{color:var(--dim);font-weight:400}
#nav{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--line);align-items:center}
#nav .sp{flex:1;color:var(--dim);font-size:11.5px;text-align:center}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#stage canvas{display:block}
#toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;z-index:4}
.grp{pointer-events:auto;background:rgba(16,19,28,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.grp .gl{font:600 10px 'JetBrains Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;padding:0 6px}
.grp button{background:transparent;border:0;color:var(--dim);font:500 12px Inter;padding:5px 9px;border-radius:7px;cursor:pointer}
.grp button:hover{color:#fff}
.grp button.on{background:#283048;color:#fff}
.grp label{font-size:11.5px;color:var(--dim);padding:0 6px;display:flex;gap:6px;align-items:center}
.grp input[type=range]{width:80px;accent-color:var(--accent)}
.grp .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
#tip{position:absolute;pointer-events:none;background:rgba(9,11,17,.96);border:1px solid #2e3650;border-radius:8px;padding:7px 9px;font:11.5px/1.5 'JetBrains Mono',monospace;display:none;max-width:360px;z-index:6;white-space:pre-wrap}
#tip b{color:var(--accent)}
#help{position:absolute;bottom:10px;right:10px;color:var(--dim);font-size:11px;background:rgba(16,19,28,.85);padding:6px 10px;border-radius:8px;border:1px solid var(--line);z-index:4}
#help kbd{font:10.5px 'JetBrains Mono',monospace;background:#232a3c;border-radius:4px;padding:0 4px;color:#fff}
#legend{position:absolute;bottom:10px;left:10px;font:10.5px 'JetBrains Mono',monospace;color:var(--dim);background:rgba(16,19,28,.85);padding:7px 10px;border-radius:8px;border:1px solid var(--line);display:grid;grid-template-columns:auto 120px;gap:4px 10px;align-items:center;z-index:4}
#legend .g{height:9px;border-radius:3px}
.tlabel{pointer-events:none;text-align:center;font:600 12px Inter;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;transition:opacity .3s}
.tlabel span{display:block;font:400 10.5px 'JetBrains Mono',monospace;color:#aab3c8}
.tlabel.dim{opacity:.25}
.compact .tlabel span,.compact .elabel,.compact .wlabel{display:none}
.elabel{pointer-events:none;font:500 10.5px 'JetBrains Mono',monospace;color:#9fb0d0;background:rgba(10,12,18,.75);padding:1px 5px;border-radius:4px;white-space:nowrap;transition:opacity .3s}
.elabel.hot{color:var(--accent);border:1px solid rgba(255,179,90,.4)}
.elabel.dim{opacity:.18}
.wlabel{pointer-events:none;font:10.5px 'JetBrains Mono',monospace;color:#cfe8ff;text-shadow:0 0 4px #000;white-space:nowrap;transition:opacity .3s}
.wlabel.q{color:var(--accent2)}
.wlabel.dim{opacity:.15}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:56vh 44vh}#panel{order:2;border-right:0;border-top:1px solid var(--line)}#stage{order:1}#help{display:none}#legend{display:none}.grp .gl{display:none}}
</style>

<body>
<div id="app">
  <aside id="panel">
    <div id="brand"><h1>Inside a Diffusion Model</h1><p>Follow one image through a latent diffusion transformer, tensor by tensor. Every cube is one number.</p></div>
    <div id="chips"></div>
    <div id="content"><div id="text"></div><div id="ctrls"></div></div>
    <div id="nav"><button class="btn" id="prev">← Prev</button><div class="sp" id="navinfo"></div><button class="btn primary" id="next">Next →</button></div>
  </aside>
  <main id="stage">
    <div id="toolbar">
      <div class="grp" id="gMode"><span class="gl">Projection</span>
        <button data-mode="volume" class="on" title="C×H×W block, channels stacked in depth">3D volume</button>
        <button data-mode="slices" title="Each channel is a constant-z square, pulled apart">Z-slices</button>
        <button data-mode="tiles" title="Channels laid side by side in one plane">2D tiles</button>
        <button data-mode="height" title="2D tiles, value shown as height">Height</button>
      </div>
      <div class="grp">
        <label title="Distance between z-slices">Spread <input type="range" id="gap" min="2" max="18" step="0.5" value="6"></label>
        <label title="Hide later channels to look inside the volume">Cut-away <input type="range" id="cut" min="0" max="1" step="0.01" value="1"></label>
        <button id="mag" class="on" title="Cube size proportional to |value| so you can see through">Size ∝ |v|</button>
      </div>
      <div class="grp" id="gCam"><span class="gl">Camera</span>
        <button data-cam="persp" class="on">Persp</button><button data-cam="ortho">Ortho</button><span class="sep"></span>
        <button data-view="iso">Iso</button><button data-view="front">Front</button><button data-view="top">Top</button><button data-view="side">Side</button><button data-view="flat" title="2D tiles + orthographic + front">Flat 2D</button><span class="sep"></span><button id="fit">Fit</button>
      </div>
      <div class="grp"><button id="dim" class="on" title="Fade tensors not in this chapter">Focus chapter</button><button id="lbl" class="on">Labels</button></div>
    </div>
    <div id="tip"></div>
    <div id="legend">
      <span>signed</span><div class="g" style="background:linear-gradient(90deg,#40b3ff,#1c1f29,#ff8c2e)"></div>
      <span>weights</span><div class="g" style="background:linear-gradient(90deg,#0d0820,#7a1f7a,#ff6a3a,#ffe9a0)"></div>
      <span>pixels</span><div class="g" style="background:linear-gradient(90deg,#ff2e26,#33ff4d,#4073ff)"></div>
    </div>
    <div id="help">drag <kbd>orbit</kbd> · right-drag <kbd>pan</kbd> · wheel <kbd>zoom</kbd> · <kbd>W A S D Q E</kbd> fly · double-click a tensor to focus it · click to select · <kbd>←</kbd><kbd>→</kbd> chapters</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* =====================================================================
   1. A tiny, real latent-diffusion-transformer pipeline (toy sizes)
   ===================================================================== */
const IMG=64, LS=16, C=8, G=8, NT=64, PD=32, D=48, NTXT=12, NB=4, DK=24, HW_IMG=IMG*IMG, HW_LAT=LS*LS;
const PROMPT=['a','lighthouse','on','a','grassy','hill','by','the','sea','at','sunset','<pad>'];
const REGIONS=['sky','sun','sea','hill','lighthouse'];
const WORDREG={lighthouse:[4],grassy:[3],hill:[3],sea:[2],sunset:[0,1]};
const CHNAME=['mean R','mean G','mean B','x-gradient','y-gradient','saddle','checker','bowl'];

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r,n,s=1){const o=new Float32Array(n);for(let i=0;i<n;i+=2){const u=r()||1e-9,v=r(),m=Math.sqrt(-2*Math.log(u));o[i]=m*Math.cos(6.283185*v)*s;if(i+1<n)o[i+1]=m*Math.sin(6.283185*v)*s;}return o;}
const clamp01=x=>x<0?0:x>1?1:x;
function matmul(A,n,a,B,b){const O=new Float32Array(n*b);for(let i=0;i<n;i++)for(let k=0;k<a;k++){const x=A[i*a+k];if(x===0)continue;const bo=k*b,oo=i*b;for(let j=0;j<b;j++)O[oo+j]+=x*B[bo+j];}return O;}
function layerNorm(X,n,d){const O=new Float32Array(n*d);for(let i=0;i<n;i++){let m=0,v=0;for(let j=0;j<d;j++)m+=X[i*d+j];m/=d;for(let j=0;j<d;j++){const q=X[i*d+j]-m;v+=q*q;}v=1/Math.sqrt(v/d+1e-5);for(let j=0;j<d;j++)O[i*d+j]=(X[i*d+j]-m)*v;}return O;}
const silu=x=>x/(1+Math.exp(-x)), gelu=x=>0.5*x*(1+Math.tanh(0.7978845608*(x+0.044715*x*x*x)));
function std(a){let m=0;for(const x of a)m+=x;m/=a.length;let v=0;for(const x of a)v+=(x-m)*(x-m);return Math.sqrt(v/a.length);}

/* ---- 1a. procedural input image: "a lighthouse on a grassy hill by the sea at sunset" ---- */
function shade(x,y){
  const H=38, lx=12;
  if(y>=3&&y<5.2){const hw=(y-3)/2.2*2.6;if(Math.abs(x-lx)<hw)return[.75,.12,.1,4];}
  if(y>=5.2&&y<9&&Math.abs(x-lx)<2.3){if(y>6&&y<8.3&&Math.abs(x-lx)<1.4)return[1,.92,.45,4];return[.12,.12,.14,4];}
  if(y>=9&&y<29){const hw=2+(y-9)*.07;if(Math.abs(x-lx)<hw){const sh=.82+.18*((x-lx)/hw);return Math.floor((y-9)/4)%2===1?[.82*sh,.15*sh,.12*sh,4]:[.96*sh,.94*sh,.88*sh,4];}}
  const ht=27.5+.03*(x-12)*(x-12);
  if(y>ht){const d=y-ht,n=Math.sin(x*1.7+y*2.3)*.035;return[.2+n,.42+.12*Math.exp(-d/6)+n,.19,3];}
  if(y>=H){const d=(y-H)/(IMG-H);if(Math.abs(x-46)<6-d*3&&Math.floor(y)%3===0)return[1,.62,.3,2];return[.07+.06*(1-d),.2+.12*(1-d),.4+.1*(1-d),2];}
  const r=Math.hypot(x-46,y-33);
  if(r<7)return[1,.86,.42,1];
  const s=y/H, top=[.1,.07,.25], mid=[.5,.18,.42], bot=[1,.55,.25];
  const c=s<.55?top.map((v,i)=>v+(mid[i]-v)*s/.55):mid.map((v,i)=>v+(bot[i]-v)*(s-.55)/.45);
  const gl=Math.exp(-r*r/200)*.35;
  return[Math.min(1,c[0]+gl),Math.min(1,c[1]+gl*.6),Math.min(1,c[2]+gl*.2),0];
}
const IMG_RGB=new Float32Array(3*HW_IMG), REGION=new Uint8Array(HW_IMG);
(()=>{const SS=3;for(let y=0;y<IMG;y++)for(let x=0;x<IMG;x++){let r=0,g=0,b=0;for(let sy=0;sy<SS;sy++)for(let sx=0;sx<SS;sx++){const s=shade(x+(sx+.5)/SS,y+(sy+.5)/SS);r+=s[0];g+=s[1];b+=s[2];}const p=y*IMG+x,n=SS*SS;IMG_RGB[p]=r/n;IMG_RGB[HW_IMG+p]=g/n;IMG_RGB[2*HW_IMG+p]=b/n;REGION[p]=shade(x+.5,y+.5)[3];}})();

/* ---- 1b. toy VAE: each 4×4×3 pixel block → 8 numbers (mean colour + 5 brightness patterns) ---- */
const BASIS=(()=>{const fns=[()=>1,(u)=>u,(u,v)=>v,(u,v)=>u*v,(u,v,i,j)=>((i+j)&1)?-1:1,(u,v)=>u*u+v*v];const E=[];
  for(const f of fns){const vec=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)vec[j*4+i]=f(i-1.5,j-1.5,i,j);
    for(const e of E){let d=0;for(let k=0;k<16;k++)d+=vec[k]*e[k];for(let k=0;k<16;k++)vec[k]-=d*e[k];}
    let n=0;for(let k=0;k<16;k++)n+=vec[k]*vec[k];n=Math.sqrt(n);for(let k=0;k<16;k++)vec[k]/=n;E.push(vec);}return E;})();
function encodeRaw(rgb){const o=new Float32Array(C*HW_LAT);for(let by=0;by<LS;by++)for(let bx=0;bx<LS;bx++){const lum=new Float32Array(16),m=[0,0,0];
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){const p=(by*4+j)*IMG+bx*4+i;for(let ch=0;ch<3;ch++)m[ch]+=rgb[ch*HW_IMG+p];lum[j*4+i]=.299*rgb[p]+.587*rgb[HW_IMG+p]+.114*rgb[2*HW_IMG+p];}
  const q=by*LS+bx;for(let ch=0;ch<3;ch++)o[ch*HW_LAT+q]=m[ch]/16;
  for(let k=1;k<6;k++){let d=0;for(let p=0;p<16;p++)d+=lum[p]*BASIS[k][p];o[(2+k)*HW_LAT+q]=d;}}return o;}
const RAW0=encodeRaw(IMG_RGB), MU=[], SD=[];
for(let c=0;c<C;c++){const s=RAW0.subarray(c*HW_LAT,(c+1)*HW_LAT);let m=0;for(const x of s)m+=x;m/=s.length;MU.push(m);SD.push(Math.max(1e-3,std(s)));}
const Z0=new Float32Array(C*HW_LAT);for(let c=0;c<C;c++)for(let q=0;q<HW_LAT;q++)Z0[c*HW_LAT+q]=(RAW0[c*HW_LAT+q]-MU[c])/SD[c];
function decode(z){const o=new Float32Array(3*HW_IMG);for(let by=0;by<LS;by++)for(let bx=0;bx<LS;bx++){const q=by*LS+bx,raw=[];for(let c=0;c<C;c++)raw.push(z[c*HW_LAT+q]*SD[c]+MU[c]);
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){let det=0;for(let k=1;k<6;k++)det+=raw[2+k]*BASIS[k][j*4+i];const p=(by*4+j)*IMG+bx*4+i;for(let ch=0;ch<3;ch++)o[ch*HW_IMG+p]=clamp01(raw[ch]+det);}}return o;}

/* region fractions per 8×8-pixel token */
const TOKFRAC=[];for(let n=0;n<NT;n++){const f=[0,0,0,0,0],gy=n>>3,gx=n&7;for(let y=0;y<8;y++)for(let x=0;x<8;x++)f[REGION[(gy*8+y)*IMG+gx*8+x]]+=1/64;TOKFRAC.push(f);}
function tokRegionName(n){const f=TOKFRAC[n];if(f[4]>.2)return'lighthouse';let b=0;for(let i=1;i<5;i++)if(f[i]>f[b])b=i;return REGIONS[b];}

/* ---- 1c. weights (seeded random — shapes are faithful, values are not trained) ---- */
const R=rng(7);
const Wpe=gauss(R,PD*D,1/Math.sqrt(PD));
const POS=new Float32Array(NT*D);for(let n=0;n<NT;n++){const gx=n&7,gy=n>>3;for(let j=0;j<12;j++){const w=1.5*Math.pow(.7,j);POS[n*D+2*j]=Math.sin(gx*w);POS[n*D+2*j+1]=Math.cos(gx*w);POS[n*D+24+2*j]=Math.sin(gy*w);POS[n*D+24+2*j+1]=Math.cos(gy*w);}}
const Wt1=gauss(R,D*D,1/Math.sqrt(D)), Wt2=gauss(R,D*D,1/Math.sqrt(D)), Wada=gauss(R,D*6*D,.35/Math.sqrt(D));
const Wb=gauss(R,D*DK,1/Math.sqrt(D)), Rq=gauss(R,D*DK,.3/Math.sqrt(D)), Rk=gauss(R,D*DK,.3/Math.sqrt(D));
const Wq=Wb.map((v,i)=>v+Rq[i]), Wk=Wb.map((v,i)=>v+Rk[i]);
const BLK=[];for(let l=0;l<NB;l++)BLK.push({Wv:gauss(R,D*D,1/Math.sqrt(D)),Wo:gauss(R,D*D,.6/Math.sqrt(D)),W1:gauss(R,D*96,1/Math.sqrt(D)),W2:gauss(R,96*D,.6/Math.sqrt(96))});
const TAU=1.35;

function patchify(z){const o=new Float32Array(NT*PD);for(let c=0;c<C;c++)for(let h=0;h<LS;h++)for(let w=0;w<LS;w++)o[((h>>1)*G+(w>>1))*PD+c*4+(h&1)*2+(w&1)]=z[c*HW_LAT+h*LS+w];return o;}
function unpatchify(t){const o=new Float32Array(C*HW_LAT);for(let c=0;c<C;c++)for(let h=0;h<LS;h++)for(let w=0;w<LS;w++)o[c*HW_LAT+h*LS+w]=t[((h>>1)*G+(w>>1))*PD+c*4+(h&1)*2+(w&1)];return o;}
function embedTokens(tok){const h=matmul(tok,NT,PD,Wpe,D);for(let i=0;i<h.length;i++)h[i]+=POS[i];return h;}

/* ---- 1d. text embeddings: hand-built so each content word resembles its image region
         (this is the alignment that real training discovers) ---- */
const TXT=new Float32Array(NTXT*D);
(()=>{const ln0=layerNorm(embedTokens(patchify(Z0)),NT,D);const RT=rng(99);
  PROMPT.forEach((w,i)=>{const nz=gauss(RT,D);const regs=WORDREG[w];

function mkHL(color,opacity){const m=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color,transparent:true,opacity,depthTest:false}));m.renderOrder=10;m.frustumCulled=false;scene.add(m);return m;}

  for(const[mn,mx]of boxes){const c=[];for(let k=0;k<8;k++)c.push([k&1?mx.x:mn.x,k&2?mx.y:mn.y,k&4?mx.z:mn.z]);for(const[a,b]of EDGE_IDX){arr.set(c[a],o);arr.set(c[b],o+3);o+=6;}}

// cells: [[c,h,w],...] grouped per channel into an AABB each

  const out=[];for(const b of by.values()){const z=state.mode==='height'?HAMP:.5;out.push([b[0].clone().addScalar(-pad).setZ(b[0].z-z-.1),b[1].clone().addScalar(pad).setZ(b[1].z+z+.1)]);}return out;}

  const out=[];const latCol=(id,lh,lw)=>{const a=[];for(let cc=0;cc<C;cc++)a.push([cc,lh,lw]);out.push([T[id],a]);};
  const imgBlock=(id,lh,lw,s=4)=>{const a=[];for(let cc=0;cc<3;cc++)for(let y=0;y<s;y++)for(let x=0;x<s;x++)a.push([cc,lh*s+y,lw*s+x]);out.push([T[id],a]);};

    if(['zk','x0k'].includes(t.id)){out.push([T[t.id==='zk'?'x0k':'zk'],[[c,h,w]]]);imgBlock(t.id==='zk'?'zkimg':'x0kimg',h,w);}

      out.push([T[['vhat','vun','vg','x0h','vt'].includes(t.id)?'otok':'tok'],[tokOf(c,h,w)]]);if(t.id!=='vhat'&&t.id!=='z0'&&t.id!=='eps'&&t.id!=='zt')out.push([T.vhat,[[c,h,w]]]);}}

const tokName=i=>i<NTXT?`"${PROMPT[i]}"`:`image patch (${(i-NTXT)>>3},${(i-NTXT)&7}) · ${tokRegionName(i-NTXT)}`;
function describe(t,c,h,w,v){

  if(t.id==='img'||t.kind==='rgb')s+=`pixel (row ${h}, col ${w}) · ${'RGB'[c]} channel\n→ summarised by latent cell (${h>>2}, ${w>>2})`;
  else if(LATIDS.includes(t.id))s+=`latent channel ${c} (toy meaning: ${CHNAME[c]})\nspatial cell (${h}, ${w}) ← pixels ${h*4}–${h*4+3}, ${w*4}–${w*4+3}\n→ token ${(h>>1)*G+(w>>1)}, dim ${c*4+(h&1)*2+(w&1)}`;
  else if(t.id==='tok'||t.id==='otok')s+=`token ${h} = patch (${h>>3}, ${h&7}) · ${tokRegionName(h)}\ndim ${w} ← latent ch ${w>>2}, sub-pixel (${(w>>1)&1}, ${w&1})`;

  else if(t.id==='attn')s+=`query: ${tokName(h)}\nkey:   ${tokName(w)}\n${(v*100).toFixed(2)}% of this query’s attention\n<i>click to make this row the selected query</i>`;

const V=THREE.Vector3;

let camAnim=null;
function boundsOf(ids){const b=new THREE.Box3();for(const id of ids){const t=T[id];const mn=t.gto.clone().sub(t.size.clone().multiplyScalar(.5)),mx=t.gto.clone().add(t.size.clone().multiplyScalar(.5));mn.y-=t.preview?50:0;mx.y+=8;b.expandByPoint(mn);b.expandByPoint(mx);}return b;}
function flyToBox(box,dir){
  if(!dir)dir=cam.position.clone().sub(ctl.target).normalize();dir=dir.clone().normalize();
  const ctr=box.getCenter(new V());
  const upW=Math.abs(dir.y)>.99?new V(0,0,-1):new V(0,1,0);const right=upW.clone().cross(dir).normalize(),up=dir.clone().cross(right).normalize();

  hw=Math.max(hw,8)*1.08;hh=Math.max(hh,8)*1.12;
  const asp=stage.clientWidth/Math.max(1,stage.clientHeight),tv=Math.tan(THREE.MathUtils.degToRad(FOV)/2),th=tv*asp;

   4. Animations: layout tween, morphs (patchify), sweeps (VAE), sampler
   ===================================================================== */
let morph=null;
function startMorph(srcId,dstId,map){
  if(morph||layoutU<1)return;const s=T[srcId],d=T[dstId],n=s.n;
  const mat=new THREE.MeshLambertMaterial();const mesh=new THREE.InstancedMesh(BOX,mat,n);mesh.frustumCulled=false;
  mesh.instanceColor=new THREE.InstancedBufferAttribute(s.mesh.instanceColor.array.slice(),3);scene.add(mesh);
  const P0=new Float32Array(n*3),P1=new Float32Array(n*3),delay=new Float32Array(n),p=new V();
  for(let i=0;i<n;i++){s.world(i,p);P0.set([p.x,p.y,p.z],3*i);const j=map(i);d.world(j,p);P1.set([p.x,p.y,p.z],3*i);delay[i]=(j/d.n)*.55;}
  s.mesh.visible=false;d.mesh.visible=false;morph={mesh,P0,P1,delay,u:0,dur:3.2,s,d};
}
function finishMorph(){if(morph){morph.u=1e9;stepMorph(0);}}
function stepMorph(dt){
  if(!morph)return;morph.u+=dt/morph.dur;const{mesh,P0,P1,delay}=morph,M=mesh.instanceMatrix.array,n=P0.length/3;
  for(let i=0;i<n;i++){let e=Math.min(1,Math.max(0,(morph.u-delay[i])/.42));e=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;const arc=Math.sin(Math.PI*e)*14;
    const o=i*16;M.fill(0,o,o+16);M[o]=M[o+5]=M[o+10]=.82;M[o+15]=1;M[o+12]=P0[3*i]+(P1[3*i]-P0[3*i])*e;M[o+13]=P0[3*i+1]+(P1[3*i+1]-P0[3*i+1])*e+arc*.4;M[o+14]=P0[3*i+2]+(P1[3*i+2]-P0[3*i+2])*e+arc;}
  mesh.instanceMatrix.needsUpdate=true;
  if(morph.u>=1){scene.remove(mesh);mesh.geometry!==BOX&&mesh.geometry.dispose();mesh.material.dispose();morph.s.mesh.visible=true;morph.d.mesh.visible=true;morph=null;}
}
const patchMap=i=>{const c=(i/HW_LAT)|0,r=i%HW_LAT,h=(r/LS)|0,w=r%LS;return((h>>1)*G+(w>>1))*PD+c*4+(h&1)*2+(w&1);};
const unpatchMap=i=>{const n=(i/PD)|0,d=i%PD,c=d>>2,h=((n>>3)<<1)+((d>>1)&1),w=((n&7)<<1)+(d&1);return c*HW_LAT+h*LS+w;};

  if(sweep)endSweep();
  if(kind==='enc'){sweep={kind,k:0,acc:0,lat:T.z0,img:T.img};T.z0.reveal=(c,h,w)=>h*LS+w<=sweep.k;}
  else{state.k=state.N;setStepData();refreshStep();sweep={kind,k:0,acc:0,lat:T.zk,img:T.out};T.out.reveal=(c,h,w)=>((h>>2)*LS+(w>>2))<=sweep.k;}
}

  if(!sweep)return;sweep.acc+=dt*48;const prev=sweep.k;sweep.k=Math.min(255,Math.floor(sweep.acc));
  if(sweep.k!==prev||sweep.acc<1){const by=sweep.k>>4,bx=sweep.k&15;const a=[];for(let c=0;c<3;c++)for(let y=0;y<4;y++)for(let x=0;x<4;x++)a.push([c,by*4+y,bx*4+x]);

  if(sweep.acc>=258)endSweep();

function selectQuery(q){state.query=q;computeAmap();T.amap.refresh();updateSelection();if(chCtl.onQuery)chCtl.onQuery();}
function updateSelection(){
  if(sweep)return;const q=state.query,b=[...boxesFor(T.attn,rowCells(T.attn,q),.6)];
  if(q<NTXT)b.push(...boxesFor(T.txt,rowCells(T.txt,q),.6));else b.push(...boxesFor(T.hid,rowCells(T.hid,q-NTXT),.6));
  setBoxes(selHL,['attention','text'].includes(CH[state.chapter].id)?b:[]);
}

   6. Chapters

const tn=(id,txt)=>`<span class="tn" data-f="${id}">${txt}</span>`;
const real=h=>`<div class="box real"><b class="h">In a real model</b>${h}</div>`;
const toy=h=>`<div class="box toy"><b class="h">Toy simplification</b>${h}</div>`;
const tryit=h=>`<div class="box try"><b class="h">Try this</b>${h}</div>`;
const act=(a,l)=>`<button class="act" data-act="${a}">${l}</button>`;
let chCtl={};
function sliderRow(parent,label,min,max,step,get,set,fmt){const r=document.createElement('div');r.className='row';
  r.innerHTML=`<span class="lab">${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><span class="val"></span>`;
  const inp=r.querySelector('input'),val=r.querySelector('.val');const sync=()=>{inp.value=get();val.textContent=fmt(+get());};
  inp.addEventListener('input',()=>{set(+inp.value);val.textContent=fmt(+inp.value);});sync();parent.appendChild(r);return sync;}
function btn(parent,label,fn,primary){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=label;b.onclick=fn;parent.appendChild(b);return b;}
function btnRow(parent){const d=document.createElement('div');d.className='btnrow';parent.appendChild(d);return d;}
function readout(parent){const d=document.createElement('div');d.className='readout';parent.appendChild(d);return d;}
const syncers=[];function syncCtrls(){for(const s of syncers)s();}
function tSlider(el){syncers.push(sliderRow(el,'noise level t',0,1,.01,()=>state.t,v=>{state.t=v;computeForward();refreshForward();syncCtrls();},v=>v.toFixed(2)+(v===0?' clean':v===1?' noise':'')));}
function wSlider(el){syncers.push(sliderRow(el,'guidance w',0,6,.1,()=>state.w,v=>{state.w=v;computeForward();refreshForward();computeSampling();refreshStep();T.out.refresh();syncCtrls();},v=>v.toFixed(1)+(v===1?' (off)':'')));}
function seedBtn(row){btn(row,'New noise seed',()=>{state.seed++;EPS=gauss(rng(state.seed*7919),C*HW_LAT);S.eps=EPS;computeForward();computeSampling();T.eps.refresh();refreshForward();refreshStep();T.out.refresh();});}
function mse(a,b){let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-b[i])**2;return s/a.length;}

const CH=[
{id:'overview',k:'00 · Orientation',title:'The big picture',focus:'all',dir:'iso',html:`
<p>A modern text-to-image model (Stable Diffusion 3, Flux and their relatives) never paints pixels directly. It <b>compresses</b> the image into a small latent tensor, learns to <b>remove noise</b> from that latent with a transformer that is told the prompt and the noise level, then <b>decodes</b> the result back to pixels.</p>
<p>Every block in the scene is a tensor, and <b>every cube is one number</b>. The middle lane is the main data path, the top lane is conditioning (text and time), and the bottom lane is the sampling loop that generates an image.</p>
<p><b>Four ways to look at a tensor</b> (toolbar, top):</p>
<p>• <b>3D volume</b>: a C×H×W block, channels stacked in depth.<br>• <b>Z-slices</b>: each channel is a constant-z square, pulled apart so you can see between them.<br>• <b>2D tiles</b>: channels laid side by side, the way papers draw them.<br>• <b>Height</b>: the tiles again, but each value becomes a column you can read from any angle.</p>
${tryit(`Orbit with the mouse, fly with <b>W A S D Q E</b>, and hover any cube to read its value. The orange outlines show where that number came from and where it goes. Click a ${tn('z0','tensor name')} in the text to fly to it.`)}
${toy(`Sizes are shrunk (64×64 image, 8-channel latent, 48-wide transformer) so every number fits on screen. Blue boxes give the real sizes. Data and shapes are computed live in your browser; the network weights are random or hand-built, not trained.`)}
`},
{id:'pixels',k:'01 · Input',title:'Pixels: the image tensor x',focus:['img'],html:`
<p>An image is a 3-D tensor of shape <b>channels × height × width</b>. Here ${tn('img','x')} is 3 × 64 × 64 = 12,288 numbers between 0 and 1. Red, green and blue are three separate 64×64 planes.</p>
<p>In <b>3D volume</b> you only see the front (red) plane. Switch to ${act('mode:slices','Z-slices')} to pull R, G and B apart, or ${act('mode:tiles','2D tiles')} to see them side by side. The flat picture under the tensor is the same data shown as a normal image.</p>
${real(`A 1024×1024 RGB image is 3 × 1024 × 1024 ≈ <b>3.1 million</b> numbers, and models scale pixels to [−1, 1]. Running attention over a million pixel positions is far too expensive. That is why the next step exists.`)}
`},
{id:'vae',k:'02 · Compression',title:'VAE encoder → latent z₀',focus:['img','z0'],html:`
<p>The <b>VAE encoder</b> turns each 4×4 block of pixels (4·4·3 = 48 numbers) into one latent cell of <b>8 channels</b>. The 64×64 image becomes ${tn('z0','z₀')} with shape 8 × 16 × 16 = 2,048 numbers. That is 6× fewer values, and the space is 16× smaller in area.</p>
<p>From here until the very last step, <b>all the diffusion happens in this latent space</b>. The transformer never sees a pixel.</p>
${tryit(`${act('sweep:enc','▶ Run encoder sweep')} to watch each block get summarised. Then hover a latent cube to see its 4×4 pixel footprint.`)}
${toy(`Our encoder is linear. Channels 0–2 hold the block's mean colour, and channels 3–7 measure brightness patterns (x-gradient, y-gradient, saddle, checker, bowl). It's like a tiny JPEG. Each channel is then standardised to mean 0, std 1.`)}
${real(`SD3 and Flux use a deep convolutional VAE with <b>8× downsampling and 16 channels</b>: 1024² × 3 → 128 × 128 × 16 ≈ 262k numbers. The learned channels have no clean human meaning. A fixed shift and scale makes the latents roughly N(0, 1), which is what makes them compatible with unit-variance noise.`)}
`},
{id:'noise',k:'03 · Training view',title:'Noise ε and the forward process',focus:['z0','eps','zt','vt'],html:`
<p>Diffusion training destroys data on purpose. Draw noise ${tn('eps','ε')} with the same shape as ${tn('z0','z₀')}, pick a noise level <b>t ∈ [0, 1]</b>, and blend the two:</p>
<div class="eq">z_t = (1 − t) · z₀  +  t · ε        (rectified flow)
v   = ε − z₀                      (training target)</div>
<p>${tn('zt','z_t')} moves along a straight line from data (t = 0) to pure noise (t = 1). The network is shown z_t and t and must predict the <b>velocity</b> ${tn('vt','v')}, the direction of that line. Because the line is straight, v is the same at every t.</p>
${tryit(`Drag <b>t</b> and watch z_t dissolve. Switch to ${act('mode:height','Height')} to see the distribution widen into noise.`)}
${real(`Training repeats this with billions of (image, caption, t, ε) samples. The loss is the mean squared error ‖v̂ − v‖². Older models (DDPM, SD 1.5) used a curved noise schedule and predicted ε instead of v, but the data flow is the same.`)}
`,ctrls:el=>{tSlider(el);seedBtn(btnRow(el));}},
{id:'patchify',k:'04 · Tokenise',title:'Patchify: from grid to sequence',focus:['zt','tok'],html:`
<p>Transformers consume a <b>sequence of vectors</b>, not a grid. <b>Patchify</b> cuts ${tn('zt','z_t')} into 2×2 spatial patches. Each patch keeps all 8 channels, giving 2·2·8 = 32 numbers. That makes the 16×16 grid an 8×8 = <b>64-token</b> sequence in raster order: ${tn('tok','tokens')} of shape 64 × 32.</p>
<p>This is a pure <b>reshape</b>, with no arithmetic. Every number keeps its value. Hover a token cube to see exactly which latent cell and sub-pixel it came from.</p>
${tryit(`${act('morph:patch','▶ Animate patchify')}. In ${act('mode:volume','3D volume')} you can watch each 2×2×8 column flatten into one row.`)}
${real(`A 128×128 latent with patch size 2 becomes <b>4,096 tokens</b> of 16·2·2 = 64 values. The token count grows with the square of the resolution. Doubling the image side gives 4× the tokens and about 16× the attention cost.`)}
`,ctrls:el=>{tSlider(el);}},
{id:'embed',k:'05 · Embed',title:'Patch embedding + position',focus:['tok','pos','hid'],html:`
<p>Each 32-value token is projected by a learned matrix to the transformer's <b>hidden width</b> (48 here). Then a ${tn('pos','position embedding')} is added so the model knows where each patch sits:</p>
<div class="eq">h = tokens · W_embed  +  pos        (64×32)·(32×48) + (64×48)</div>
<p>Attention ignores order, so without position information patch (0,0) and patch (7,7) would look the same. Our ${tn('pos','pos')} uses 2-D sine and cosine waves: the first 24 dims encode the column, the last 24 the row.</p>
${tryit(`Use ${act('mode:height','Height')} and orbit around ${tn('pos','pos')} to see the waves at different frequencies. Hover a row of ${tn('hid','h')} to light up its pixels.`)}
${real(`Hidden width is 1,536 in SD3-medium and 3,072 in Flux. SD3 adds 2-D sin/cos embeddings like ours. Flux uses <b>RoPE</b>, which rotates the queries and keys inside attention instead of adding a vector.`)}
`,ctrls:el=>{tSlider(el);}},
{id:'text',k:'06 · Condition',title:'Text: the prompt as tokens',focus:['txt'],html:`
<p>The prompt <i>"${PROMPT.slice(0,11).join(' ')}"</i> is split into tokens. A frozen text encoder turns each token into a vector, and a linear layer projects it to the hidden width. That gives ${tn('txt','text embeddings')}: 12 tokens × 48, one row per word.</p>
<p>These rows will sit in the <b>same sequence</b> as the image tokens. Then every image patch can look at every word, and the reverse.</p>
${toy(`Our word vectors are hand-built so "lighthouse" resembles the lighthouse patches, "sea" the sea patches, and so on. That alignment is what training discovers. Function words like "a" and "the" are random.`)}
${real(`SD3 uses <b>T5-XXL</b> (4,096-d per token) plus two CLIP encoders, whose pooled vectors also feed the conditioning vector c (next chapter). Flux uses T5 with up to 512 tokens plus a pooled CLIP vector.`)}
`},
{id:'time',k:'07 · Condition',title:'Timestep → adaLN modulation',focus:['temb','cvec','ada'],html:`
<p>The same weights must denoise at every noise level, so the network is told <b>t</b>. The flow is:</p>
<div class="eq">t ─► sin/cos at 24 frequencies   (temb, 48)
  ─► MLP                         (c, 48)
  ─► per-block linear            (6 × 48)
     shift₁ scale₁ gate₁ │ shift₂ scale₂ gate₂</div>
<p>Inside each block, before attention and before the MLP, the tokens are normalised and then <b>modulated</b>:</p>
<div class="eq">h' = LayerNorm(h) · (1 + scale) + shift
h  = h + gate · SubLayer(h')</div>
${tryit(`Drag <b>t</b> and watch ${tn('temb','temb')} cycle through its frequencies, and ${tn('ada','the adaLN parameters')} change. The noise level controls how every block behaves.`)}
${real(`This is <b>adaLN-Zero</b> from the DiT paper. The gate weights start at zero, so every block begins as the identity function, which makes deep stacks stable to train. The pooled text vector is added into c, so global prompt information flows through the same path.`)}
`,ctrls:el=>{tSlider(el);}},
{id:'attention',k:'08 · Mix',title:'Joint attention: text ↔ image',focus:['hid','txt','attn','amap'],html:`
<p>Text rows and image rows are concatenated into one sequence of 12 + 64 = <b>76 tokens</b> (MM-DiT "joint attention"). Each token makes a query q, a key k and a value v. The attention matrix ${tn('attn','A')} says how much each query (row) reads from each key (column):</p>
<div class="eq">A = softmax( Q·Kᵀ / √d )      (76×24)·(24×76) → 76×76
out = A · V</div>
<p>The four quadrants (split by gaps): <b>top-left</b> text→text, <b>top-right</b> text→image, <b>bottom-left</b> image→text (how the prompt steers each patch), <b>bottom-right</b> image→image.</p>
<div id="qchips" class="btnrow"></div>
${tryit(`Pick a word above, or click any row of A or any token of ${tn('hid','h')}. ${tn('amap','The 8×8 map')} shows where that query looks in the image. Then drag <b>t</b> toward 1: noisy image tokens give blurry, unfocused attention.`)}
${real(`At 1024², 4,096 image tokens plus 512 text tokens give a 4,608² ≈ 21 million-entry matrix per head, per layer. FlashAttention computes it in tiles so the full matrix is never stored.`)}
`,ctrls:el=>{tSlider(el);const bars=document.createElement('div');bars.className='bars';el.appendChild(bars);const ro=readout(el);
  const draw=()=>{const NS=NTXT+NT,q=state.query;let tx=0;bars.innerHTML='';for(let j=0;j<NTXT;j++){const v=S.attn[q*NS+j];tx+=v;bars.innerHTML+=`<span>${PROMPT[j]}</span><div class="b" style="width:${Math.max(.5,v*100*2.2)}%"></div><span class="n">${(v*100).toFixed(1)}%</span>`;}
    ro.innerHTML=`query <b>${tokName(q)}</b> · ${(tx*100).toFixed(0)}% on text, ${(100-tx*100).toFixed(0)}% on image`;
    document.querySelectorAll('.wchip').forEach(b=>b.classList.toggle('on',+b.dataset.q===q));};
  chCtl.onQuery=draw;syncers.push(draw);
  const qc=document.getElementById('qchips');PROMPT.forEach((w,i)=>{const b=document.createElement('button');b.className='wchip';b.textContent=w;b.dataset.q=i;b.onclick=()=>selectQuery(i);qc.appendChild(b);});draw();}},
{id:'stack',k:'09 · Depth',title:'The transformer stack',focus:['hid','res','ada'],html:`
<p>One DiT block is attention followed by an MLP, each wrapped in adaLN and a residual add:</p>
<div class="eq">h = h + gate₁ · Attn( mod₁(LN(h)) )
h = h + gate₂ · MLP ( mod₂(LN(h)) )      48 → 96 → 48</div>
<p>The ${tn('res','residual stream')} stacks the image tokens after each block: layer × token × dim = 5 × 64 × 48. Channel 0 is the input h; channel 4 is after the last block. The shape never changes. Blocks only <b>add</b> refinements to the stream.</p>
${tryit(`${act('mode:slices','Z-slices')} turns the layers into a flip-book. Orbit to the side to compare them. Turn on ${act('mode:tiles','2D tiles')} to read them left to right.`)}
${toy(`4 blocks with random weights, reusing one attention pattern. The shapes and wiring are faithful, but the values carry no learned meaning.`)}
${real(`SD3-medium has 24 joint blocks. Flux has 19 "double-stream" blocks (separate weights for text and image, joint attention) followed by 38 "single-stream" blocks over the merged sequence. That's about 12 billion parameters.`)}
`,ctrls:el=>{tSlider(el);}},
{id:'output',k:'10 · Predict',title:'Output: the predicted velocity v̂',focus:['otok','vhat','vt','x0h'],html:`
<p>A final LayerNorm, modulation and linear layer map each 48-wide token back to 32 numbers: ${tn('otok','output tokens')}. <b>Unpatchify</b> is the exact inverse reshape and rebuilds the latent grid ${tn('vhat','v̂')} (8 × 16 × 16).</p>
<p>During training, v̂ is compared with the target ${tn('vt','v = ε − z₀')}. During generation, v̂ also gives the model's current guess of the clean image:</p>
<div class="eq">x̂₀ = z_t − t · v̂</div>
${tryit(`${act('morph:unpatch','▶ Animate unpatchify')}. Then drag <b>t</b>: at high noise ${tn('x0h','x̂₀')} is a blurry average, and near t = 0 it sharpens.`)}
${toy(`Our v̂ comes from an "oracle" that knows z₀ but sees it more blurred at higher t. That copies a real trait: trained models settle coarse layout early and fine detail late.`)}
`,ctrls:el=>{tSlider(el);const ro=readout(el);const f=()=>{ro.innerHTML=`training loss  MSE(v̂, v) = <b>${mse(S.vhat,S.vt).toFixed(4)}</b>`;};syncers.push(f);f();}},
{id:'cfg',k:'11 · Steer',title:'Classifier-free guidance',focus:['vhat','vun','vg'],html:`
<p>At generation time the network is usually run <b>twice per step</b>: once with the prompt (${tn('vhat','v̂')}) and once with an empty prompt (${tn('vun','v̂∅')}). The difference points toward "more like the prompt". Guidance extrapolates along it:</p>
<div class="eq">v̂_cfg = v̂∅ + w · (v̂ − v̂∅)</div>
<p>w = 1 is the plain conditional prediction. w > 1 pushes harder, which gives better prompt adherence, more contrast and saturation and less variety. Push it too far and colours burn out.</p>
${tryit(`Drag <b>w</b> and compare ${tn('vg','v̂_cfg')} with v̂. Then jump to the ${act('chapter:sampling','sampling loop')} and look at the final image.`)}
${real(`Typical w is 3.5–7 for SD3. Flux-dev is <b>guidance-distilled</b>: w is passed in as another embedding (like t), so a single forward pass imitates the two-pass result.`)}
`,ctrls:el=>{tSlider(el);wSlider(el);}},
{id:'sampling',k:'12 · Generate',title:'The sampling loop',focus:['zk','zkimg','x0k','x0kimg','out'],html:`
<p>Generation runs the flow in reverse. Start from pure noise z = ε at t = 1. At each step, run the whole network from chapters 4–11 and take a small Euler step against the predicted velocity:</p>
<div class="eq">for k in 0 … N−1:
    v = model(z_k, t_k, prompt)        # with CFG
    z_{k+1} = z_k − (t_k − t_{k+1}) · v</div>
<p>${tn('zk','z_k')} is the state. ${tn('zkimg','decode(z_k)')} shows what it looks like in pixels, and ${tn('x0kimg','decode(x̂₀)')} shows the model's running guess of the final image. Watch it go from blurry layout to fine detail.</p>
${tryit(`Press <b>Play</b>, or scrub <b>step k</b>. Try 4 steps against 40, and shift 1 against 3. Shift spends more steps at high noise, where the layout is decided.`)}
${toy(`Because our "model" is an oracle that knows one image, every seed ends at the same lighthouse. A trained model maps each seed to a different image that fits the prompt.`)}
${real(`SD3 uses 28–40 steps with shift 3.0 at 1024², and Flux-schnell needs about 4 steps. Each step is a full transformer pass (two with CFG). That is where nearly all the generation time goes.`)}
`,ctrls:el=>{
  const ro=readout(el);
  syncers.push(sliderRow(el,'step k',0,state.N,1,()=>state.k,v=>{state.k=v;setStepData();refreshStep();syncCtrls();},v=>`${v} / ${state.N}`));
  const kin=el.lastChild.querySelector('input');
  syncers.push(sliderRow(el,'steps N',2,50,1,()=>state.N,v=>{state.N=v;kin.max=v;state.k=Math.min(state.k,v);computeSampling();refreshStep();T.out.refresh();syncCtrls();},v=>v));
  syncers.push(sliderRow(el,'timestep shift',1,6,.1,()=>state.shift,v=>{state.shift=v;computeSampling();refreshStep();T.out.refresh();syncCtrls();},v=>v.toFixed(1)));
  wSlider(el);
  const r=btnRow(el);const pb=btn(r,'▶ Play',()=>{if(state.k>=state.N){state.k=0;setStepData();refreshStep();}state.playing=!state.playing;syncCtrls();},true);
  btn(r,'⟲ Reset to noise',()=>{state.playing=false;state.k=0;setStepData();refreshStep();syncCtrls();});seedBtn(r);
  const f=()=>{kin.max=state.N;pb.textContent=state.playing?'❚❚ Pause':'▶ Play';ro.innerHTML=`step <b>${state.k}</b>/${state.N} · t = <b>${TS[state.k].toFixed(3)}</b> · network evaluations so far: <b>${state.k*(state.w===1?1:2)}</b>`;};syncers.push(f);f();}},
{id:'decode',k:'13 · Output',title:'VAE decoder → pixels',focus:['img','zk','out'],html:`
<p>When t reaches 0, the final latent ${tn('zk','z')} goes through the <b>VAE decoder</b>. Each latent cell expands back into a 4×4×3 block of pixels, producing ${tn('out','the final image')}. Compare it with the ${tn('img','input')} that started the training story.</p>
${tryit(`${act('sweep:dec','▶ Run decoder sweep')}, then hover the output to trace any pixel back to its latent cell.`)}
<p><b>The whole journey, toy vs. real (SD3-class, 1024²):</b></p>
<table class="shapes"><tr><th>tensor</th><th>toy</th><th>real</th></tr>
<tr><td>pixels x</td><td>3×64×64</td><td>3×1024×1024</td></tr>
<tr><td>latent z</td><td>8×16×16</td><td>16×128×128</td></tr>
<tr><td>image tokens</td><td>64 × 32</td><td>4096 × 64</td></tr>
<tr><td>hidden h</td><td>64 × 48</td><td>4096 × 1536+</td></tr>
<tr><td>text tokens</td><td>12 × 48</td><td>~77–512 × 4096→hidden</td></tr>
<tr><td>attention</td><td>76²</td><td>~4.6k² per head</td></tr>
<tr><td>blocks</td><td>4</td><td>24–57</td></tr>
<tr><td>steps</td><td>${state.N}</td><td>4–50</td></tr></table>
<p>Go back to the ${act('chapter:overview','overview')} and follow the arrows end to end. You now know what every block is.</p>
`,enter:()=>{state.k=state.N;setStepData();refreshStep();}},
];

const textEl=document.getElementById('text'),ctrlsEl=document.getElementById('ctrls'),chipsEl=document.getElementById('chips');
CH.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i;b.title=c.title;b.onclick=()=>goChapter(i);chipsEl.appendChild(b);});
let curFocus='all';
function goChapter(i,instant){
  i=Math.max(0,Math.min(CH.length-1,i));const c=CH[i];state.chapter=i;state.playing=false;if(sweep)endSweep();finishMorph();
  chipsEl.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i));
  textEl.innerHTML=`<div class="kicker">${c.k}</div><h2>${c.title}</h2>${c.html}`;
  ctrlsEl.innerHTML='';syncers.length=0;chCtl={};if(c.ctrls)c.ctrls(ctrlsEl);if(c.enter)c.enter();
  document.getElementById('navinfo').textContent=`${i+1} / ${CH.length}`;
  document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===CH.length-1?'Restart ↺':'Next →';
  curFocus=c.focus;labelR.domElement.classList.toggle('compact',c.focus==='all');for(const t of TL)t.setFocus(c.focus==='all'||c.focus.includes(t.id));styleEdges();updateSelection();
  textEl.querySelector('h2').scrollIntoView({block:'start'});document.getElementById('content').scrollTop=0;
  fitChapter(c.dir?VIEWS[c.dir]:null);
  try{if(location.hash.slice(1)!==c.id)history.replaceState(null,'','#'+c.id);}catch(e){}
}
function fitChapter(dir){const c=CH[state.chapter];focusTensors(c.focus==='all'?TL.map(t=>t.id):c.focus,dir||null);}
textEl.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){focusTensors([f.dataset.f]);return;}
  const a=e.target.closest('[data-act]');if(!a)return;const[k,v]=a.dataset.act.split(':');
  if(k==='mode')setMode(v);else if(k==='sweep')startSweep(v);else if(k==='chapter')goChapter(CH.findIndex(c=>c.id===v));
  else if(k==='morph'){if(v==='patch')startMorph('zt','tok',patchMap);else startMorph('otok','vhat',unpatchMap);}});
document.getElementById('prev').onclick=()=>goChapter(state.chapter-1);
document.getElementById('next').onclick=()=>goChapter(state.chapter===CH.length-1?0:state.chapter+1);
addEventListener('hashchange',()=>{const i=CH.findIndex(c=>c.id===location.hash.slice(1));if(i>=0&&i!==state.chapter)goChapter(i);});

/* toolbar */
function setMode(m){finishMorph();state.mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));relayout(true);fitChapter();}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('gap').oninput=e=>{state.gap=+e.target.value;if(state.mode!=='slices')setMode('slices');else relayout(false);};
document.getElementById('cut').oninput=e=>{state.cut=+e.target.value;refreshAll();};
document.getElementById('mag').onclick=e=>{state.mag=!state.mag;e.currentTarget.classList.toggle('on',state.mag);refreshAll();};
document.getElementById('dim').onclick=e=>{state.dim=!state.dim;e.currentTarget.classList.toggle('on',state.dim);for(const t of TL)t.setFocus(t.focused);styleEdges();};
document.getElementById('lbl').onclick=e=>{state.labels=!state.labels;e.currentTarget.classList.toggle('on',state.labels);labelR.domElement.style.display=state.labels?'':'none';};
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>setOrtho(b.dataset.cam==='ortho'));
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='flat'){setOrtho(true);setMode('tiles');fitChapter(VIEWS.front);}else fitChapter(VIEWS[v]);});
document.getElementById('fit').onclick=()=>fitChapter();

/* =====================================================================
   7. Main loop
   ===================================================================== */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);labelR.setSize(w,h);persp.aspect=w/h;persp.updateProjectionMatrix();
  const a=w/h;ortho.left=-ORTHO_H/2*a;ortho.right=ORTHO_H/2*a;ortho.top=ORTHO_H/2;ortho.bottom=-ORTHO_H/2;ortho.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
relayout(false);refreshAll();
const startIdx=Math.max(0,CH.findIndex(c=>c.id===location.hash.slice(1)));
{const b=boundsOf(TL.map(t=>t.id)),c=b.getCenter(new V());ctlP.target.copy(c);persp.position.copy(c).add(new V(250,200,900));}
goChapter(startIdx);
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(.05,clock.getDelta());
  if(layoutU<1){layoutU=Math.min(1,layoutU+dt/.75);const e=layoutU<.5?4*layoutU**3:1-Math.pow(-2*layoutU+2,3)/2;for(const t of TL){t.place(e);t.refresh();}updateEdges();if(layoutU>=1)updateSelection();}
  if(camAnim){camAnim.u=Math.min(1,camAnim.u+dt/.9);const e=1-Math.pow(1-camAnim.u,3);cam.position.lerpVectors(camAnim.fp,camAnim.tp,e);ctl.target.lerpVectors(camAnim.ft,camAnim.tt,e);
    if(state.ortho){ortho.zoom=camAnim.fz+(camAnim.tz-camAnim.fz)*e;ortho.updateProjectionMatrix();}if(camAnim.u>=1)camAnim=null;}
  flyKeys(dt);stepMorph(dt);stepSweep(dt);stepPlay(dt);
  ctl.update();
  if(mouseIn&&(mouseDirty||camAnim||layoutU<1)){mouseDirty=false;pick();}
  renderer.render(scene,cam);labelR.render(scene,cam);
  requestAnimationFrame(frame);
}

frame();
console.log('[diffusion-tutorial] ready',{tensors:TL.length,instances:TL.reduce((a,t)=>a+t.n,0)});
